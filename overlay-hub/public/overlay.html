<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/scoreboard.css">
<link rel="stylesheet" href="/extras.css">
<style>
  /* Add this page to OBS as a Browser source at 1920×1080. Everything but the overlays is see-through. */
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  .viewport { position: fixed; inset: 0; overflow: hidden; }
  .is-gone .viewport { display: none; }
</style>
</head>
<body>
<div class="viewport" id="viewport"></div>
<script src="/match.js"></script>
<script src="/stage.js"></script>
<script src="/scoreboard.js"></script>
<script src="/extras-model.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/canvas.js"></script>
<script src="/desk.js"></script>
<script src="/games-view.js"></script>
<script src="/challenges-view.js"></script>
<script src="/media-view.js"></script>
<script src="/subathon-view.js"></script>
<script src="/twitch-view.js"></script>
<script src="/overlays.js"></script>
<script src="/connect.js"></script>
<script>
  // One page for every overlay: each one draws into the same 1920×1080 stage.
  // The code in the link (/overlay/<code>) decides whose overlays show here; /overlay alone is the first streamer.
  const code = decodeURIComponent((location.pathname.split('/')[2] || '').trim());
  const stage = Stage.create(document.getElementById('viewport'));
  const shown = {};
  Object.entries(OverlayRegistry).forEach(([id, o]) => { shown[id] = { o, view: o.mount(stage, { send: (m) => link && link.send(m) }) }; });
  let brand = '';
  // The streamer's brand colour is the scoreboard's accent when it's set to Brand
  const draw = (id, state) => { const m = shown[id]; if (!m) return; const n = m.o.normalize(state); if (id === 'scoreboard' && brand) n.look = Object.assign({}, n.look, { brand }); m.view.render(n); };
  // Tells the hub each change has been drawn here, so it can show "applied"
  const lastAck = {};
  const ack = (id, state) => { const ts = state && state.ts; if (!ts || lastAck[id] === ts || !link) return; lastAck[id] = ts; link.send({ type: 'applied', module: id, ts }); };
  const link = Live.connect({
    onMessage: (msg) => {
      if (msg.type === 'laser' && shown.canvas && shown.canvas.view.laser) shown.canvas.view.laser(msg.on, msg.x, msg.y);
      // Hide everything is an emergency: everything goes at once, with no exit animation
      if (msg.type === 'instant') { document.documentElement.classList.add('instant'); setTimeout(() => document.documentElement.classList.remove('instant'), msg.ms || 1500); }
    },
    onHello: (msg) => {
      document.body.classList.remove('is-gone');
      if (msg.streamer) {
        Scoreboard.setCrestBase(`/api/crest/${msg.streamer.id}`);
        // This streamer's look for every overlay: font, corners, and how overlays come on and go off
        const look = msg.streamer.look || {};
        brand = look.brand || '';
        stage.el.dataset.font = look.font || 'barlow';
        stage.el.dataset.corners = look.corners || 'rounded';
        stage.el.dataset.anim = look.anim || 'slide';
        // Stacking order: the first overlay in the list sits on top
        (msg.streamer.stack || []).forEach((id, i, all) => { const m = shown[id]; if (m && m.view.el.root) m.view.el.root.style.zIndex = String(all.length - i); });
      }
      Object.entries(msg.modules || {}).forEach(([id, state]) => draw(id, state));
    },
    onState: (id, state) => { draw(id, state); ack(id, state); },
    onGone: () => document.body.classList.add('is-gone'), // the link was reset or the streamer removed
  }, { role: 'overlay', code });
</script>
</body>
</html>
